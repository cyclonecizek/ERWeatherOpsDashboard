name: Update hub from issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pages: write

# One change at a time, so two people adding tools at once don't collide.
concurrency:
  group: hub-tools
  cancel-in-progress: false

jobs:
  apply:
    if: startsWith(github.event.issue.title, '[Hub]') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the change to tools.json
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          AUTHOR_ASSOC: ${{ github.event.issue.author_association }}
          COLLABORATORS_ONLY: ${{ vars.HUB_COLLABORATORS_ONLY }}
        run: python3 .github/scripts/apply_hub_issue.py

      - name: Commit and push
        if: steps.apply.outputs.result == 'ok'
        env:
          SUMMARY: ${{ steps.apply.outputs.summary }}
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools.json
          git diff --cached --quiet && exit 0
          git commit -m "$SUMMARY (#$NUM)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Rebuild the Pages site
        if: steps.apply.outputs.result == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true

      - name: Reply on the issue
        if: always() && steps.apply.outputs.result != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "${{ github.repository }}" --body-file /tmp/hub_reply.md
          if [ "${{ steps.apply.outputs.result }}" = "ok" ]; then
            gh issue close "$NUM" --repo "${{ github.repository }}" --reason completed
          fi
